<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klipy Extension Settings</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .options-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .options-header h1 {
      margin: 0 0 8px;
      font-family: 'Pixelify Sans', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .options-header p {
      margin: 0;
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .options-card {
      background-color: var(--surface-color);
      padding: 28px;
      border: 3px solid var(--border-color);
      box-shadow: 6px 6px 0 0 var(--shadow-color);
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-family: 'Pixelify Sans', sans-serif;
      font-weight: 600;
      font-size: 15px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 3px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      font-family: "Kanit", sans-serif;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: background-color 0.2s ease;
    }

    input[type="text"]:focus {
      background-color: var(--surface-color);
      border-color: var(--accent-color);
    }

    .help-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      line-height: 1.5;
    }

    .help-text a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 2px solid transparent;
    }

    .help-text a:hover {
      border-bottom-color: var(--accent-color);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-primary {
      flex: 1;
      background-color: var(--accent-color);
      color: white;
      border: 3px solid var(--border-color);
      padding: 12px 24px;
      cursor: pointer;
      font-family: "Pixelify Sans", sans-serif;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 4px 4px 0 0 var(--shadow-color);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-primary:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 0 var(--shadow-color);
    }

    #status {
      margin-top: 20px;
      padding: 12px 16px;
      border: 3px solid var(--border-color);
      font-family: "Pixelify Sans", sans-serif;
      font-weight: 600;
      font-size: 14px;
      display: none;
      box-shadow: 4px 4px 0 0 var(--shadow-color);
    }

    .status-success {
      background-color: #e6f9ed;
      color: #1b8a4f;
      display: block !important;
    }
    
    body.dark-mode .status-success {
      background-color: #143522;
      color: #6ee7b7;
    }

    .status-error {
      background-color: #ffeef0;
      color: var(--accent-color);
      display: block !important;
    }
    
    body.dark-mode .status-error {
      background-color: #3b1d22;
      color: #ff8b9e;
    }

    .theme-toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 0;
      border-top: 3px dashed var(--border-color);
      margin-top: 28px;
    }

    .theme-toggle-row span {
      font-family: 'Pixelify Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>

<body class="light-mode">
  <div class="options-header">
    <h1>
      <svg class="pixel-icon" viewBox="0 0 16 16" width="28" height="28" fill="currentColor" style="vertical-align: middle;">
        <rect x="7" y="0" width="2" height="2" />
        <rect x="7" y="14" width="2" height="2" />
        <rect x="0" y="7" width="2" height="2" />
        <rect x="14" y="7" width="2" height="2" />
        <rect x="2" y="2" width="2" height="2" />
        <rect x="12" y="2" width="2" height="2" />
        <rect x="2" y="12" width="2" height="2" />
        <rect x="12" y="12" width="2" height="2" />
        <path d="M5 3h6v10H5z" />
        <path d="M3 5h10v6H3z" />
        <rect x="7" y="7" width="2" height="2" fill="var(--surface-color)" />
      </svg>
      Settings
    </h1>
    <p>Configure your Klipy GIF Search extension</p>
  </div>

  <div class="options-card">
    <div class="form-group">
      <label for="apiKey">🔑 Klipy API Key</label>
      <input type="text" id="apiKey" placeholder="Enter your Klipy API Key">
      <div class="help-text">
        Get a free API key from the
        <a href="https://partner.klipy.com/api-keys" target="_blank">Klipy Partner Panel ↗</a>
      </div>
    </div>

    <div class="btn-row">
      <button id="saveBtn" class="btn-primary">Save Settings</button>
    </div>

    <div id="status"></div>

    <div class="theme-toggle-row">
      <span>Theme Option</span>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
        <svg class="pixel-icon sun-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
           <rect x="6" y="1" width="4" height="2"/><rect x="1" y="6" width="2" height="4"/><rect x="13" y="6" width="2" height="4"/><rect x="6" y="13" width="4" height="2"/><rect x="4" y="4" width="8" height="8"/><rect x="3" y="3" width="1" height="1"/><rect x="12" y="3" width="1" height="1"/><rect x="3" y="12" width="1" height="1"/><rect x="12" y="12" width="1" height="1"/>
        </svg>
        <svg class="pixel-icon moon-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
           <path d="M5 1h5v1H5v2H3v2H2v4h1v2h2v1h5v-1H7v-1H5v-2H4V6h1V4h2V2h3V1h-5zm6 2h1v8h-1V3z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="options.js"></script>
</body>

</html>
